name: 持续集成

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: 格式检查
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: 运行测试
        run: go test ./...
      - name: 编译程序
        run: go build ./cmd/jdb
